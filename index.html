<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VICAZ TV - Your Home of Entertainment</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#090909;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#151515;
 padding:15px;
 text-align:center;
 border-bottom:2px solid #e50914;
}
.logo{
 width:100%;
 max-width:420px;
 max-height:130px;
 object-fit:contain;
}
nav{
 padding:14px;
 text-align:center;
 background:#1b1b1b;
}
nav a{
 color:white;
 text-decoration:none;
 margin:0 10px;
 font-size:14px;
}
.hero{
 padding:55px 20px;
 min-height:260px;
 background:linear-gradient(90deg,#000,#550000);
}
.hero h1{font-size:36px}
.hero p{color:#ddd;line-height:1.6}
button{
 background:#e50914;
 color:white;
 border:0;
 padding:12px 18px;
 border-radius:5px;
 font-weight:bold;
}
section{padding:20px 15px}
h2{
 border-left:4px solid #e50914;
 padding-left:10px;
}
.movies{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:14px;
}
.card{
 background:#1b1b1b;
 border-radius:8px;
 overflow:hidden;
}
.card iframe{
 width:100%;
 aspect-ratio:16/9;
 border:0;
}
.card h3{font-size:15px;padding:0 10px}
.card p{font-size:12px;color:#bbb;padding:0 10px}
.card a{
 display:block;
 background:#e50914;
 color:white;
 text-align:center;
 padding:12px;
 text-decoration:none;
}
.info{
 background:#191919;
 padding:20px;
 margin:15px 0;
 border-radius:8px;
}
.info p{line-height:1.6;color:#ddd}
footer{
 background:#151515;
 text-align:center;
 padding:25px;
 color:#aaa;
}
@media(min-width:700px){
 .movies{grid-template-columns:repeat(3,1fr)}
 .hero{padding:85px 50px}
}
</style>
</head>

<body>

<header>
<img class="logo"
src="a_bold_glossy_cinematic_logo_banner_on_a_dark_bl.png"
alt="VICAZ TV Logo">
</header>

<nav>

<a href="#movies">Trailers</a>
