name: Update YouTube Movies

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Fetch YouTube uploads
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json

          url = "https://www.youtube.com/feeds/videos.xml?playlist_id=UURFtWAz1p0LZujP2Hflzw2A"
          data = urllib.request.urlopen(url).read()
          root = ET.fromstring(data)
          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015"
          }

          videos = []
          for entry in root.findall("atom:entry", ns):
              video_id = entry.findtext("yt:videoId", namespaces=ns)
              title = entry.findtext("atom:title", namespaces=ns)
              if video_id and title:
                  videos.append({
                      "id": video_id,
                      "title": title
                  })

          with open("videos.json", "w") as f:
              json.dump(videos, f, indent=2)
          PY

      - name: Save updated movie list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || git commit -m "Update YouTube movies"
          git push
