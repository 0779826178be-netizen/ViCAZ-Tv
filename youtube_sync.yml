name: YouTube Video Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch YouTube videos
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json

          url = "https://www.youtube.com/feeds/videos.xml?playlist_id=UURFtWAz1p0LZujP2Hflzw2A"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          root = ET.fromstring(urllib.request.urlopen(req).read())

          ns = {
              "a": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015"
          }

          videos = []
          for entry in root.findall("a:entry", ns):
              vid = entry.findtext("yt:videoId", namespaces=ns)
              title = entry.findtext("a:title", namespaces=ns)
              if vid:
                  videos.append({
                      "id": vid,
                      "title": title,
                      "url": "https://www.youtube.com/watch?v=" + vid,
                      "thumbnail": "https://i.ytimg.com/vi/" + vid + "/hqdefault.jpg"
                  })

          with open("videos.json", "w") as f:
              json.dump(videos, f, indent=2)
          PY

      - name: Save changes
        run: |
          git config user.name "VICAZ TV"
          git config user.email "actions@github.com"
          git add videos.json
          git diff --cached --quiet || git commit -m "Update YouTube videos"
          git push
