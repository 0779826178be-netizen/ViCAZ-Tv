name: YouTube Video Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Update videos.json
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json

          url = "https://www.youtube.com/feeds/videos.xml?playlist_id=UURFtWAz1p0LZujP2Hflzw2A"

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          data = urllib.request.urlopen(request).read()
          root = ET.fromstring(data)

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015"
          }

          videos = []

          for entry in root.findall("atom:entry", ns):
              video_id = entry.findtext("yt:videoId", namespaces=ns)
              title = entry.findtext("atom:title", namespaces=ns)

              if video_id:
                  videos.append({
                      "id": video_id,
                      "title": title,
                      "url": "https://www.youtube.com/watch?v=" + video_id,
                      "thumbnail": "https://i.ytimg.com/vi/" + video_id + "/hqdefault.jpg"
                  })

          with open("videos.json", "w") as file:
              json.dump(videos, file, indent=2)

          print("Videos found:", len(videos))
          PY

      - name: Save updated videos
        run: |
          git config user.name "VICAZ TV"
          git config user.email "actions@github.com"
          git add videos.json
          git diff --cached --quiet || git commit -m "Update YouTube videos"
          git push
